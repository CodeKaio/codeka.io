{{ partial "head/head.html" . }}
    <body class="{{if .Site.Params.layoutReverse}}layout-reverse {{end}}{{if .Site.Params.dark_mode}}dark-theme{{end}}">
        <div class="wrapper">
            {{ partial "sidebar/sidebar.html" . }}
            <main class="content container">
                {{ block "main" . -}}{{- end }}
            </main>
            {{ block "sidebar" . }}{{ end }}
        </div>

        {{ if .Store.Get "hasMermaid" }}
        <script defer src="/js/mermaid/mermaid.min.js"></script>
        <script defer src="/js/mermaid/mermaid-init.js"></script>
        {{ end }}
    </body>
</html>
